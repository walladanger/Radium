<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCP tool browser</title>
  <!-- The host serves the theme at a fixed path on the panel origin. Using it
       is what makes a third-party panel look like part of the app. -->
  <link rel="stylesheet" href="/panel-theme.css" />
  <style>
    body { margin: 0; padding: 12px; font: 12px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--panel-muted); }
    select, button { font: inherit; color: var(--panel-fg); background: var(--panel-card); border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 6px; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .row select { flex: 1; min-width: 0; }
    .hint { color: var(--panel-muted); }
    .bad { color: var(--panel-danger); }
    pre { margin: 8px 0 0; padding: 8px; border: 1px solid var(--panel-border); border-radius: 6px; background: var(--panel-code); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <h1>MCP tool browser</h1>
  <div class="row">
    <select id="tools" disabled><option>Loading…</option></select>
    <button id="run" disabled>Run</button>
  </div>
  <div id="status" class="hint">Reading the tool list…</div>
  <pre id="output" hidden></pre>

  <script type="module">
    import { panel } from '/panel-sdk.js'

    const select = document.getElementById('tools')
    const run = document.getElementById('run')
    const status = document.getElementById('status')
    const output = document.getElementById('output')

    // The host pushes the current theme on init, so a subscriber registered
    // here does not miss the first value.
    panel.onTheme((theme) => {
      document.documentElement.dataset.theme = theme
    })

    const say = (text, bad = false) => {
      status.textContent = text
      status.className = bad ? 'bad' : 'hint'
    }

    /**
     * A denial is a manifest problem the author can fix, and the error says
     * which permission is missing — so it is worth printing rather than
     * swallowing into "something went wrong".
     */
    const explain = (error) =>
      error.code === 'permission_denied'
        ? `${error.message} — add it to panel.json and reinstall.`
        : error.message

    async function load() {
      try {
        const tools = await panel.tools()
        if (tools.length === 0) {
          // Not an error: the server this panel is allowed to reach may
          // simply not be connected. Saying so beats an empty dropdown.
          say('No tools available. Is the server in `mcpServers` connected?')
          return
        }
        select.innerHTML = ''
        for (const tool of tools) {
          const option = document.createElement('option')
          option.value = tool.name
          option.textContent = tool.name
          option.title = tool.description ?? ''
          select.append(option)
        }
        // Per-panel storage is namespaced to this panel, so remembering a
        // selection cannot collide with another panel's keys.
        const last = await panel.get('last-tool')
        if (last && tools.some((tool) => tool.name === last)) select.value = last
        select.disabled = false
        run.disabled = false
        say(`${tools.length} ${tools.length === 1 ? 'tool' : 'tools'} available.`)
      } catch (error) {
        say(explain(error), true)
      }
    }

    run.addEventListener('click', async () => {
      const name = select.value
      run.disabled = true
      say(`Running ${name}…`)
      try {
        await panel.set('last-tool', name)
        const result = await panel.callTool(name, {})
        output.hidden = false
        output.textContent = JSON.stringify(result, null, 2)
        say(`${name} returned.`)
      } catch (error) {
        output.hidden = true
        say(explain(error), true)
      } finally {
        run.disabled = false
      }
    })

    await load()
    // Tells the host the panel has rendered, so it drops the spinner. A panel
    // that never calls this is treated as a static page after a moment.
    panel.ready()
  </script>
</body>
</html>
