[package]
name = "atomic-control"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
atomic-agent-core = { path = "../atomic-agent-core" }
async-trait = "0.1"
tokio-util = "0.7"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
