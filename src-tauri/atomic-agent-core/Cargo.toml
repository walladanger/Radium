[package]
name = "atomic-agent-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Radium agent engine with host-injected tool execution"

[workspace]

[dependencies]
async-trait = "0.1"
futures-util = "0.3.31"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
rmcp = { version = "2.1.0", features = ["client"] }
dirs = "6.0.0"
hex = "0.4"
log = "0.4"
zip = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.10"
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.14"
uuid = { version = "1.7", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
hyper = { version = "0.14", features = ["server"] }
tempfile = "3.20.0"
