# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # super-linter reports each linter's outcome as a commit status. Without
      # this the run still lints, but every status POST fails with a 403.
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #@v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 #@v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo-level .github/actionlint.yaml (shared with local
          # actionlint runs) instead of .github/linters/actionlint.yml. The
          # path is relative to LINTER_RULES_PATH (.github/linters).
          GITHUB_ACTIONS_CONFIG_FILE: ../actionlint.yaml
          # v4 never commented on PRs; keep it that way (the job has no
          # pull-requests: write). Results stay in the log and step summary.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # src-tauri/resources/agent-skills/ holds third-party skills bundled
          # verbatim (UI UX Pro Max, MIT). Their bodies are kept byte-for-byte
          # from upstream on purpose, so linting them to this repo's Python,
          # Markdown and duplicate-code rules only produces failures we must not
          # "fix" by editing vendored code. Exclude the whole vendored tree; the
          # skills are reviewed on import and gated by cargo tests instead.
          FILTER_REGEX_EXCLUDE: "src-tauri/resources/agent-skills/"
          # JSCPD (off for now, see the end of this block) runs at threshold 0,
          # and src-tauri/src/lib.rs is excluded in
          # .github/linters/.jscpd.json because it holds two deliberately
          # parallel `tauri::generate_handler!` lists — the desktop command
          # surface and the mobile one, which is the same surface minus the
          # desktop-only commands. Tauri's proc macro needs each list spelled
          # out literally at its call site, so the duplication is structural:
          # any command added to the app lengthens both lists and the clone
          # with them. The alternative, splicing a shared list in through a
          # `macro_rules!` wrapper, would hide the whole IPC surface behind a
          # macro and break the two guards that read lib.rs textually
          # (web-app/src/lib/__tests__/ipc-contract.test.ts, which pins exactly
          # which handlers are desktop-only, and tests/capabilities.test.mjs).
          # Those guards are worth more than the clone report, so the file is
          # excluded rather than refactored. Everything else stays at zero.
          # super-linter looks for the markdown config at
          # `.github/linters/.markdown-lint.yml` by default
          # (MARKDOWN_FILE_NAME in lib/linter.sh), so our
          # `.markdownlint.json` was never read and it silently fell back to
          # its own bundled TEMPLATES/.markdown-lint.yml. That template leaves
          # MD025 and MD034 on, which every ADR here violates by design: the
          # records carry YAML frontmatter with a `title:` *and* an `# H1`,
          # which MD025 counts as two titles. So MARKDOWN went red whenever a
          # record changed, while our deliberate rule choices sat dead on
          # disk. Naming the file we actually have makes them effective.
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          # textlint's terminology preset cannot tell prose from identifiers or
          # from quoted document titles, so it rejects "id", "api" and "ids"
          # wherever they appear. Markdown style is covered by markdownlint
          # (.github/linters/.markdownlint.json).
          VALIDATE_NATURAL_LANGUAGE: false
          # clippy here runs with super-linter's own bundled Cargo, which is too
          # old to read this repository's lockfile at all:
          #   error: failed to parse lock file at: src-tauri/Cargo.lock
          #   lock file version `4` was found, but this version of Cargo does
          #   not understand this lock file
          # So it reports one error and no findings on any PR that touches
          # Cargo.toml or Rust. radium-ci.yml runs the real clippy, over
          # `make verify`, with the toolchain and system libraries it needs.
          VALIDATE_RUST_CLIPPY: false
          # super-linter's rustfmt validators cannot lint this crate either. The
          # crate is edition 2021, so RUST_2015 and RUST_2018 abort on the first
          # `async fn` (error[E0670]: `async fn` is not permitted in Rust 2015),
          # and RUST_2021 runs a different rustfmt build than the repo's pinned
          # toolchain, so it reports formatting diffs on files that the repo's
          # own `cargo fmt` considers clean. Rust lints are enforced
          # authoritatively by rust-clippy.yml and radium-ci.yml (real
          # toolchain); keep these three super-linter validators off.
          VALIDATE_RUST_2015: false
          VALIDATE_RUST_2018: false
          VALIDATE_RUST_2021: false
          # Same reason for the RUST_2024 validator that super-linter added
          # after v4: wrong edition and a different rustfmt than the toolchain.
          VALIDATE_RUST_2024: false
          # Moving from super-linter v4 to v9 keeps the set of linters that v4
          # ran here. The validators below are new since v4 or changed scope,
          # and are left off so the upgrade doesn't change what this check
          # enforces. Each one can be switched on in its own PR once its
          # existing findings are dealt with:
          # - BIOME_FORMAT / BIOME_LINT scan the whole repository on every run
          #   and overlap with the Prettier and ESLint setup this repo uses.
          # - CHECKOV and TRIVY scan the whole repository as infrastructure as
          #   code, mostly hitting the vendored agent-skills Terraform/Helm
          #   samples, which FILTER_REGEX_EXCLUDE doesn't cover for them.
          # - JSCPD: v4 checked only the files a PR changed; v9 always scans
          #   the whole repository, and existing duplication (~4%) is far
          #   over the threshold of 0 in .github/linters/.jscpd.json.
          # - GITHUB_ACTIONS_ZIZMOR is a new workflow security audit. Its
          #   findings (workflow_run trigger, caches in release builds,
          #   persisted checkout credentials) need workflow design changes.
          # - YAML_PRETTIER is new formatting enforcement for every YAML file.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_JSCPD: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_YAML_PRETTIER: false
