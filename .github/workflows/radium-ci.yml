name: Radium CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radium-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast when a change reuses a version number (tracker D34: every test
  # build a user downloads gets a new one). windows-test-build.yml enforces the
  # same rule, but only after a ~30-minute build; this reports it in seconds on
  # every PR so a forgotten `make bump-version` is caught before review.
  version-check:
    name: Version number is new
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-build-version compares against the test-build/v* tags, so it
          # needs full history and every tag, not the default shallow clone.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: This change carries a new version number
        run: |
          git fetch --tags --force origin
          version=$(node scripts/check-build-version.mjs --prefix test-build/v)
          echo "Version $version is new."

  verify:
    name: Repository verification
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-radium-ci-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-radium-ci-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            pkg-config \
            unzip

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
          yarn --version

      - name: Install dependencies and build core/extensions
        run: make install-and-build

      - name: Run authoritative repository verification
        run: make verify
